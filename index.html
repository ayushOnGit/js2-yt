<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube Clone</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- navbar -->

  <nav class="navbar">

    <div class="toggle-btn">

      <span></span>
      <span></span>
      <span></span>

    </div>

    <img src="img/logo.PNG" class="logo" alt="Logo" />
    <div class="search-box">

      <input type="text" class="search-bar" placeholder="Search" />
      <button class="search-btn">
        <img src="img/search.png" alt="Search" />
      </button>

    </div>

    <div class="user-options">

      <img src="img/video.PNG" alt="Upload" class="icon" />
      <img src="img/grid.PNG" alt="Notification" class="icon" />
      <img src="img/bell.PNG" alt="Profile" class="icon" />

      <div class="user-dp">

        <img src="img/profile-pic.png" alt="User Profile" />

      </div>

    </div>

  </nav>



  <!-- sidebar -->

  <div class="sidebar">

    <a href="#" class=" links active"><img src="img/home.PNG" alt="Home" />Home</a>
    <a href="#" class=" links"><img src="img/explore.png" alt="Home" />Explore</a>
    <a href="#" class=" links"><img src="img/subscription.PNG" alt="Home" />Subscriptions</a>
    <hr class="seperator" />
    <a href="#" class=" links"><img src="img/Library.png" alt="Home" />Library</a>
    <a href="#" class=" links"><img src="img/History.png" alt="Home" />History</a>


  </div>


  <div class="filters">

    <button class="filter-btn active">All</button>
    <button class="filter-btn">Music</button>
    <button class="filter-btn">Gaming</button>
    <button class="filter-btn">News</button>
    <button class="filter-btn">Live</button>
    <button class="filter-btn">Sports</button>

  </div>

  
<div class="video-container" id="mainVideoContainer">

  <!-- all the cards will be generated here  -->

</div>


 
    

 <script src="app.js"></script>

</body>

</html>
